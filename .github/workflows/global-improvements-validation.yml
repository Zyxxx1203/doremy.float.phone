name: Validate global compatibility improvements

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/global-improvements-validation.yml"
      - "components/chat/call-auto-chat-control.tsx"
      - "components/chat/voice-call-screen.tsx"
      - "components/screenshot/**"
      - "components/settings/image-generation-settings.tsx"
      - "components/settings/device-compatibility-settings.tsx"
      - "components/device-compatibility-bootstrap.tsx"
      - "components/phone-settings-app.tsx"
      - "components/desktop-shell.tsx"
      - "components/archive-room-app.tsx"
      - "components/icon-glyph.tsx"
      - "components/chat/rich-input-modals.tsx"
      - "components/chat/message-bubble.tsx"
      - "components/chat/chat-room.tsx"
      - "components/main-app.tsx"
      - "lib/download-utils.ts"
      - "styles/chat.css"
      - "lib/desktop-config.ts"
      - "lib/media-cache-storage.ts"
      - "lib/chat-engine.ts"
      - "app/layout.tsx"
      - "styles/phone-shell.css"
      - "components/widget/widget-settings.tsx"
      - "lib/chat-storage.ts"
      - "lib/device-compatibility.ts"
      - "lib/shell-notify.ts"
      - "lib/device-action/**"
      - "lib/image-generation-service.ts"
      - "lib/perception/**"
      - "lib/settings-storage.ts"
      - "lib/settings-types.ts"
      - "lib/screenshot/**"
      - "lib/shell-call-overlay.ts"
      - "lib/system-calendar/bridge.ts"
      - "lib/widget/engine.ts"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: global-improvements-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run build
