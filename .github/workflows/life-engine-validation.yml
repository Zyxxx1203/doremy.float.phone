name: Virtual life feature validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, feat/life-engine-foundation, codex/life-system-overhaul-v2, feature/life-system, feature/life-system-mainline]
  push:
    branches: [codex/life-system-overhaul-v2, feat/life-engine-foundation, feat/life-agent-autonomy, feature/life-system, feature/life-system-mainline]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: life-engine-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Life schedule regression tests (UTC)
        run: TZ=UTC npm run test:life
      - name: Life schedule regression tests (daylight-saving timezone)
        run: TZ=America/New_York npm run test:life
      - name: Production build
        run: npm run build
