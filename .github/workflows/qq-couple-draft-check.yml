name: QQ couple-space draft feature check

on:
  push:
    branches: [feature/qq-couple-space-draft]
    paths:
      - "android-shell/**"
      - "lib/internal-capability-storage.ts"
      - "lib/tool-executor.ts"
      - ".github/workflows/qq-couple-draft-check.yml"
  pull_request:
    paths:
      - "android-shell/**"
      - "lib/internal-capability-storage.ts"
      - "lib/tool-executor.ts"

jobs:
  web-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type-check feature files and report existing repository errors
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false 2>&1 | tee /tmp/tsc.log
          tsc_status=${PIPESTATUS[0]}
          set -e

          if grep -E '^(lib/internal-capability-storage\.ts|lib/tool-executor\.ts)\(' /tmp/tsc.log; then
            echo "::error::TypeScript errors were found in the QQ couple-space feature files."
            exit 1
          fi

          if [ "$tsc_status" -ne 0 ]; then
            echo "::warning::The repository-wide TypeScript check still reports existing errors outside the QQ couple-space feature files. These unrelated errors do not block this feature check."
          else
            echo "Repository TypeScript check passed."
          fi
