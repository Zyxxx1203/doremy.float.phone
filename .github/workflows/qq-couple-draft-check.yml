name: QQ couple-space draft feature check

on:
  push:
    branches: [feature/qq-couple-space-draft]
    paths:
      - "android-shell/**"
      - "lib/internal-capability-storage.ts"
      - "lib/tool-executor.ts"
      - ".github/workflows/qq-couple-draft-check.yml"

jobs:
  android-shell:
    runs-on: ubuntu-latest
    env:
      SHELL_SITE_URL: ${{ vars.SHELL_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"
      - name: Build Android shell APKs
        run: gradle -p android-shell assembleDebug assembleRelease

  web-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
