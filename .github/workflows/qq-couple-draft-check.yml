name: QQ couple-space draft feature check

on:
  push:
    branches: [feature/qq-couple-space-draft]
    paths:
      - "android-shell/**"
      - "lib/internal-capability-storage.ts"
      - "lib/tool-executor.ts"
      - ".github/workflows/qq-couple-draft-check.yml"
  pull_request:
    paths:
      - "android-shell/**"
      - "lib/internal-capability-storage.ts"
      - "lib/tool-executor.ts"

jobs:
  web-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
