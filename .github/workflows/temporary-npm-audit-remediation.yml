name: Temporary dependency audit remediation

on:
  push:
    branches: [main]
    paths:
      - ".github/audit-fix.trigger"

permissions:
  contents: write

concurrency:
  group: temporary-npm-audit-remediation
  cancel-in-progress: false

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Synchronize dependencies and lockfile
        run: npm install --ignore-scripts
      - name: Apply non-breaking security updates
        shell: bash
        run: |
          npm audit fix --ignore-scripts || true
          npm audit --json > npm-audit-after.json || true
          node -e 'const a=require("./npm-audit-after.json"); console.log("AUDIT_AFTER",JSON.stringify(a.metadata?.vulnerabilities||{})); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name, v.severity, "fixAvailable="+JSON.stringify(v.fixAvailable));'
      - name: Commit updated dependency lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were produced."
            exit 0
          fi
          git commit -m "fix(deps): apply non-breaking security updates"
      - name: Push dependency update
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --quiet HEAD^ HEAD -- package.json package-lock.json; then
            echo "No dependency changes to push."
            exit 0
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main