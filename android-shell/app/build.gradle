plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 生活系统独立测试包：包名与 main 正式版不同，因此可并排安装，
// 不会覆盖正式版，也不会共享 Android 本地 WebView 沙盒数据。
// 签名：CI 里通过环境变量注入 keystore（见 android-shell/README.md）。
def ksFile = System.getenv("SHELL_KEYSTORE_FILE")
def siteUrl = (System.getenv("SHELL_SITE_URL") ?: "https://example.invalid").replaceAll('/+$', '')

android {
    namespace 'app.floatphone.shell'
    compileSdk 36

    defaultConfig {
        // 仅生活系统分支使用独立 applicationId；main 仍为 app.floatphone.shell。
        applicationId "app.floatphone.shell.lifetest"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "life-test-1.0"
        buildConfigField "String", "SITE_URL", "\"\${siteUrl}\""
    }

    buildFeatures { buildConfig true }

    if (ksFile) {
        signingConfigs {
            release {
                storeFile file(ksFile)
                storePassword System.getenv("SHELL_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SHELL_KEY_ALIAS")
                keyPassword System.getenv("SHELL_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
        debug {
            if (ksFile) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
